<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイヌ文化 ミニテスト（画像表示対応版）</title>
    <!-- MediaPipe FaceMesh （顔認証・目線検出ライブラリ） -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif;
            background-color: #e0f7fa;
            color: #333;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            box-sizing: border-box;
        }

        #app-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 850px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        ruby { ruby-align: center; }
        rt { font-size: 0.55em; color: #00695c; font-weight: bold; }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #00838f;
            margin-bottom: 10px;
        }

        /* 事前確認用カードスタイル */
        .preview-card {
            background-color: #ffffff;
            border: 3px solid #00838f;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .preview-card-header {
            font-size: 18px;
            font-weight: bold;
            color: #00695c;
            border-bottom: 2px dashed #b2dfdb;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .preview-q-text {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .preview-choices {
            display: flex;
            gap: 10px;
        }

        .preview-choice-item {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .preview-opt1 { background-color: #e8f5e9; color: #1b5e20; border: 2px solid #a5d6a7; }
        .preview-opt2 { background-color: #fff3e0; color: #e65100; border: 2px solid #ffe0b2; }

        .preview-choice-img {
            max-width: 160px;
            max-height: 160px;
            border-radius: 8px;
            margin-top: 8px;
            object-fit: contain;
            border: 1px solid #ccc;
        }

        /* 問題文ボックス */
        .question-box {
            background-color: #f4fbfb;
            border: 2px solid #b2f2e8;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: left;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.6;
            color: #222;
        }

        /* 左右2択レイアウト */
        .choices-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice-card {
            flex: 1;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            box-sizing: border-box;
            transition: all 0.2s ease;
            opacity: 0.5;
            border: 4px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .choice-straight { background-color: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
        .choice-moved { background-color: #fff3e0; color: #e65100; border-color: #ffe0b2; }

        /* 読み上げ中の黄色い発光スタイル */
        .choice-card.speaking {
            opacity: 1.0 !important;
            transform: scale(1.05) !important;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9) !important;
            border-color: #ffd700 !important;
            border-width: 6px !important;
            background-color: #fffde7 !important;
        }

        /* 判定中アクティブスタイル */
        .choice-card.active {
            opacity: 1.0;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 150, 136, 0.4);
        }
        .choice-straight.active { border-color: #2e7d32; border-width: 6px; }
        .choice-moved.active { border-color: #ef6c00; border-width: 6px; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 10px;
            color: white;
        }
        .choice-straight .badge { background-color: #4caf50; }
        .choice-moved .badge { background-color: #ff9800; }

        .choice-text {
            font-size: 22px;
            word-break: break-all;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .choice-img {
            width: 100%;
            max-width: 260px;
            height: 180px;
            border-radius: 10px;
            margin-top: 5px;
            object-fit: contain;
            background-color: #fff;
            border: 2px solid #ccc;
        }

        /* 選択プログレスゲージ */
        .gauge-container {
            width: 100%;
            border-radius: 8px;
            height: 14px;
            overflow: hidden;
            margin-top: 10px;
        }
        .choice-straight .gauge-container { background-color: #c8e6c9; }
        .choice-moved .gauge-container { background-color: #ffe0b2; }

        .gauge-bar {
            width: 0%;
            height: 100%;
            transition: width 0.05s linear;
        }
        .gauge-bar-straight { background-color: #2e7d32; }
        .gauge-bar-moved { background-color: #ef6c00; }

        /* カメラモニター・判定表示・感度調整エリア */
        .camera-monitor {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .monitor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        #webcam {
            width: 90px;
            height: 68px;
            border-radius: 8px;
            object-fit: cover;
            transform: scaleX(-1);
            background-color: #000;
        }
        .status-badge {
            font-size: 18px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
        }
        .status-straight { background-color: #c8e6c9; color: #2e7d32; }
        .status-moved { background-color: #ffe0b2; color: #ef6c00; }
        .status-waiting { background-color: #e0e0e0; color: #666; }

        .sensitivity-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #e0f2f1;
            padding: 6px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #004d40;
            width: 90%;
            justify-content: center;
        }
        .sensitivity-slider {
            width: 150px;
            cursor: pointer;
        }

        /* ボタン関係 */
        .btn {
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            color: white;
            margin: 5px;
        }
        .btn-start { background-color: #4caf50; font-size: 26px; }
        .btn-preview { background-color: #ff9800; font-size: 22px; }
        .btn-utility { font-size: 16px; padding: 8px 16px; border-radius: 10px; }
        .btn-read { background-color: #2196f3; }
        .btn-print { background-color: #00bcd4; }
        .btn-clear { background-color: #e91e63; }

        #feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            font-weight: bold;
            display: none;
            z-index: 100;
            pointer-events: none;
        }
        .correct { color: #f44336; }
        .incorrect { color: #2196f3; }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 16px;
        }
        .result-table th, .result-table td {
            border: 2px solid #b2dfdb;
            padding: 10px;
            text-align: left;
        }
        .result-table th { background-color: #e0f2f1; color: #00695c; text-align: center; }
        .text-center { text-align: center !important; }
        .status-ok { color: #d32f2f; font-weight: bold; font-size: 20px; }
        .status-ng { color: #1976d2; font-weight: bold; font-size: 20px; }

        .history-section {
            margin-top: 20px;
            border-top: 2px dashed #b2dfdb;
            padding-top: 15px;
            text-align: left;
        }

        .hidden { display: none !important; }

        @media print {
            body { background: white !important; padding: 0 !important; color: black !important; }
            #app-container { box-shadow: none !important; border: none !important; padding: 0 !important; max-width: 100% !important; }
            .no-print, button, .btn, .btn-utility, .camera-monitor { display: none !important; }
            #screen-start, #screen-quiz, #screen-result { display: none !important; }
            #screen-preview { display: block !important; }
            .preview-card { page-break-inside: avoid; border: 2px solid #000 !important; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- スタート画面 -->
        <div id="screen-start">
            <div class="title">アイヌ<ruby>文化<rt>ぶんか</rt></ruby> ミニテスト</div>
            <p style="font-size: 20px; line-height: 1.6; margin-bottom: 20px;">
                【目線（めせん）・顔の動きでの えらびかた】<br>
                <b>まっすぐ見る（正面）</b> ➔ <b>ひだり側の答え（2.5秒キープ）</b><br>
                <b>左・右・上のどこかを大きく見る</b> ➔ <b>みぎ側の答え（2.5秒キープ）</b><br>
                <span style="font-size: 16px; color: #666;">（かんがえる時間は むせいげんです）</span>
            </p>
            <div>
                <button class="btn btn-preview" onclick="showPreviewScreen()">📄 まずはみんなで問題を見る</button>
                <br>
                <button class="btn btn-start" onclick="initCameraAndStart()">📷 カメラを許可して スタート！</button>
            </div>
        </div>

        <!-- 事前確認画面 -->
        <div id="screen-preview" class="hidden">
            <div class="title">アイヌ<ruby>文化<rt>ぶんか</rt></ruby> 問題一覧カード</div>
            <p style="font-size: 18px; color: #555; margin-bottom: 15px;">じっくり答えを考えてからテストにちょうせんしよう！</p>
            
            <div id="preview-list"></div>

            <div class="no-print" style="margin-top: 20px;">
                <button class="btn btn-utility btn-print" onclick="window.print()">🖨️ 問題カードをいんさつする</button>
                <button class="btn btn-start" onclick="initCameraAndStart()">📷 テストをスタートする！</button>
            </div>
        </div>

        <!-- クイズ画面 -->
        <div id="screen-quiz" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 20px; font-weight: bold; color: #00838f;" id="q-number"></span>
                <button class="btn btn-utility btn-read" onclick="readQuestionAndChoices(event)">🔊 もう一度読む</button>
            </div>
            
            <div class="question-box">
                <div class="question-text" id="q-text"></div>
            </div>

            <!-- 左右2択 -->
            <div class="choices-container">
                <!-- 左：まっすぐ見る（1番） -->
                <div class="choice-card choice-straight" id="card-opt1">
                    <div>
                        <div class="badge">👀 まっすぐ見る（左）</div>
                        <div class="choice-text" id="opt1-text"></div>
                        <div id="opt1-img-box"></div>
                    </div>
                    <div class="gauge-container">
                        <div id="straight-gauge" class="gauge-bar gauge-bar-straight"></div>
                    </div>
                </div>

                <!-- 右：大きく動かす（2番） -->
                <div class="choice-card choice-moved" id="card-opt2">
                    <div>
                        <div class="badge">↗️ 左・右・上を大きく見る（右）</div>
                        <div class="choice-text" id="opt2-text"></div>
                        <div id="opt2-img-box"></div>
                    </div>
                    <div class="gauge-container">
                        <div id="moved-gauge" class="gauge-bar gauge-bar-moved"></div>
                    </div>
                </div>
            </div>

            <!-- カメラ・判定ステータス・感度調整 -->
            <div class="camera-monitor">
                <div class="monitor-row">
                    <video id="webcam" autoplay playsinline muted></video>
                    <div>
                        <span style="font-size: 14px; color: #666;">今の状態：</span>
                        <span id="gaze-status" class="status-badge status-straight">まっすぐ見ている</span>
                    </div>
                </div>
                
                <div class="sensitivity-box">
                    <span>⚙️ 反応の強さ：</span>
                    <input type="range" id="sensSlider" class="sensitivity-slider" min="1" max="5" value="2">
                    <span id="sensText">しっかり動かす（推奨）</span>
                </div>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="screen-result" class="hidden">
            <div class="title">アイヌ<ruby>文化<rt>ぶんか</rt></ruby> テスト<ruby>結果<rt>けっか</rt></ruby></div>
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;" id="result-date"></div>
            <div style="font-size: 32px; font-weight: bold; color: #e65100; margin-bottom: 15px;" id="score-display"></div>

            <h3>【 今回のテスト結果 】</h3>
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">問題</th>
                        <th>内容</th>
                        <th style="width: 20%;">判定</th>
                    </tr>
                </thead>
                <tbody id="current-result-body"></tbody>
            </table>

            <div class="no-print" style="margin: 15px 0;">
                <button class="btn btn-utility btn-print" onclick="window.print()">🖨️ 結果をいんさつする</button>
                <button class="btn btn-utility btn-start" style="font-size: 18px; padding: 10px 20px;" onclick="location.reload()">🔄 もう一度テストをする</button>
            </div>

            <div class="history-section no-print">
                <h3>📜 これまでの過去の記録</h3>
                <div id="history-container"></div>
                <button class="btn btn-utility btn-clear" style="margin-top: 10px;" onclick="clearHistory()">🗑️ 過去の記録をけす</button>
            </div>
        </div>

        <!-- マルバツ表示 -->
        <div id="feedback"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const HOLD_TIME = 2500;

        // 全7問（画像データを直接Base64埋め込み）
        const quizData = [
            {
                title: "アイヌのあいさつ",
                q_html: "第一問 アイヌの<ruby>言葉<rt>ことば</rt></ruby>で「あなたのこころにそっとふれさせてください。」という<ruby>優<rt>やさ</rt></ruby>しいあいさつは、どっち？",
                q_speech: "第一問、アイヌのことばで、あなたのこころにそっとふれさせてください、という優しいあいさつは、どっち？",
                choices: [
                    { label: "１．アロハ", speech: "まっすぐ見ると、1番、アロハ", isCorrect: false },
                    { label: "２．イランカラプテ", speech: "大きく目を動かすと、2番、イランカラプテ", isCorrect: true }
                ]
            },
            {
                title: "アイヌが暮らしていた場所",
                q_html: "第二問 アイヌの<ruby>人<rt>ひと</rt></ruby>たちが、むかしから<ruby>暮<rt>く</rt></ruby>らしていたのはどこ？",
                q_speech: "第二問、アイヌのひとたちが、むかしからくらしていたのはどこ？",
                choices: [
                    { label: "１．<ruby>北海道<rt>ほっかいどう</rt></ruby>", speech: "まっすぐ見ると、1番、ほっかいどう", isCorrect: true },
                    { label: "２．アメリカ", speech: "大きく目を動かすと、2番、アメリカ", isCorrect: false }
                ]
            },
            {
                title: "アイヌの温かい汁物",
                q_html: "第三問 さけや<ruby>野菜<rt>やさい</rt></ruby>など、ちかくでとれるものをつかって<ruby>作<rt>つく</rt></ruby>る、<ruby>温<rt>あたた</rt></ruby>かい<ruby>汁物<rt>しるもの</rt></ruby>はどれでしょう？",
                q_speech: "第三問、さけや野菜など、ちかくでとれるものをつかってつくる、あたたかいしるものはどれでしょう？",
                choices: [
                    { label: "１．ラーメン", speech: "まっすぐ見ると、1番、ラーメン", isCorrect: false },
                    { label: "２．オハウ", speech: "大きく目を動かすと、2番、オハウ", isCorrect: true }
                ]
            },
            {
                title: "自然への感謝の呼び方",
                q_html: "第四問 アイヌの<ruby>人<rt>ひと</rt></ruby>たちは<ruby>動物<rt>どうぶつ</rt></ruby>や<ruby>自然<rt>しぜん</rt></ruby>などを、<ruby>何<rt>なに</rt></ruby>と<ruby>呼<rt>よ</rt></ruby>んで<ruby>感謝<rt>かんしゃ</rt></ruby>しましたか？",
                q_speech: "第四問、アイヌのひとたちは動物や自然などを、何と呼んで感謝しましたか？",
                choices: [
                    { label: "１．おばけ", speech: "まっすぐ見ると、1番、おばけ", isCorrect: false },
                    { label: "２．カムイ（かみさま）", speech: "大きく目を動かすと、2番、カムイ かみさま", isCorrect: true }
                ]
            },
            {
                title: "食べ物をとる時の工夫",
                q_html: "第五問 アイヌの<ruby>人<rt>ひと</rt></ruby>たちは、らいねんもまた<ruby>魚<rt>さかな</rt></ruby>やさんさいがとれるように、どのようなくふうをしていましたか？",
                q_speech: "第五問、アイヌのひとたちは、らいねんもまた魚やさんさいがとれるように、どのようなくふうをしていましたか？",
                choices: [
                    { label: "１．<ruby>自分<rt>じぶん</rt></ruby>たちのたべるぶんだけ<ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>をとった。", speech: "まっすぐ見ると、1番、自分たちのたべるぶんだけ食べ物をとった。", isCorrect: true },
                    { label: "２．あるものぜんぶとった。", speech: "大きく目を動かすと、2番、あるものぜんぶとった。", isCorrect: false }
                ]
            },
            {
                title: "アイヌの服",
                q_html: "第六問 アイヌの<ruby>服<rt>ふく</rt></ruby>（着物）はどっち？",

        function showPreviewScreen() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-preview').classList.remove('hidden');

            const container = document.getElementById('preview-list');
            container.innerHTML = '';

            quizData.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'preview-card';

                let choice1Content = `👀 ${q.choices[0].label}`;
                if(q.choices[0].imgSrc) {
                    choice1Content += `<br><img src="${q.choices[0].imgSrc}" class="preview-choice-img">`;
                }

                let choice2Content = `↗️ ${q.choices[1].label}`;
                if(q.choices[1].imgSrc) {
                    choice2Content += `<br><img src="${q.choices[1].imgSrc}" class="preview-choice-img">`;
                }

                card.innerHTML = `
                    <div class="preview-card-header">${q.title}</div>
                    <div class="preview-q-text">${q.q_html}</div>
                    <div class="preview-choices">
                        <div class="preview-choice-item preview-opt1">${choice1Content}</div>
                        <div class="preview-choice-item preview-opt2">${choice2Content}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function initCameraAndStart() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            const videoElement = document.getElementById('webcam');

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceMeshResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });

            await camera.start();

            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-preview').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            showQuestion();
        }

        function getThresholds() {
            const xMargin = 0.22 - (sensLevel - 1) * 0.035;
            const eyeDiffX = 0.016 - (sensLevel - 1) * 0.0022; 
            const eyeDiffY = 0.014 - (sensLevel - 1) * 0.002;

            return {
                xMin: 0.5 - xMargin,
                xMax: 0.5 + xMargin,
                yMin: 0.44 - (sensLevel - 1) * 0.02,
                eyeDiffX: eyeDiffX,
                eyeDiffY: eyeDiffY
            };
        }

        function onFaceMeshResults(results) {
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                resetGauges();
                return;
            }

            const landmarks = results.multiFaceLandmarks[0];

            const nose = landmarks[1];
            const rightFace = landmarks[234];
            const leftFace = landmarks[454];
            const topFace = landmarks[10];
            const chin = landmarks[152];

            const faceWidth = Math.abs(leftFace.x - rightFace.x) || 0.001;
            const faceHeight = Math.abs(chin.y - topFace.y) || 0.001;

            const xRatio = (nose.x - Math.min(rightFace.x, leftFace.x)) / faceWidth;
            const yRatio = (nose.y - topFace.y) / faceHeight;

            const t = getThresholds();

            let eyeMoved = false;
            if (landmarks[468] && landmarks[473]) {
                const rIris = landmarks[468];
                const lIris = landmarks[473];
                const rEyeCenter = { x: (landmarks[33].x + landmarks[133].x)/2, y: (landmarks[33].y + landmarks[133].y)/2 };
                const lEyeCenter = { x: (landmarks[362].x + landmarks[263].x)/2, y: (landmarks[362].y + landmarks[263].y)/2 };

                const rDiffX = Math.abs(rIris.x - rEyeCenter.x);
                const lDiffX = Math.abs(lIris.x - lEyeCenter.x);
                const rDiffY = rIris.y - rEyeCenter.y;
                const lDiffY = lIris.y - lEyeCenter.y;

                if (rDiffX > t.eyeDiffX || lDiffX > t.eyeDiffX || rDiffY < -t.eyeDiffY || lDiffY < -t.eyeDiffY) {
                    eyeMoved = true;
                }
            }

            const isFaceMoved = (xRatio < t.xMin) || (xRatio > t.xMax) || (yRatio < t.yMin);
            const isMoved = isFaceMoved || eyeMoved;
            const newState = isMoved ? 'moved' : 'straight';

            const statusBadge = document.getElementById('gaze-status');
            const cardOpt1 = document.getElementById('card-opt1');
            const cardOpt2 = document.getElementById('card-opt2');
            const straightGauge = document.getElementById('straight-gauge');
            const movedGauge = document.getElementById('moved-gauge');

            if (!canAcceptInput) {
                currentGazeState = null;
                gazeStateStartTime = null;
                if (straightGauge) straightGauge.style.width = '0%';
                if (movedGauge) movedGauge.style.width = '0%';
                return;
            }

            if (newState !== currentGazeState) {
                currentGazeState = newState;
                gazeStateStartTime = Date.now();
                straightGauge.style.width = '0%';
                movedGauge.style.width = '0%';
            }

            const elapsed = Date.now() - gazeStateStartTime;

            if (newState === 'moved') {
                statusBadge.innerText = "大きく動いている（2.5秒キープ中）";
                statusBadge.className = "status-badge status-moved";

                cardOpt1.classList.remove('active');
                cardOpt2.classList.add('active');

                const progress = Math.min(100, (elapsed / HOLD_TIME) * 100);
                movedGauge.style.width = progress + '%';
                straightGauge.style.width = '0%';

                if (elapsed >= HOLD_TIME) {
                    resetGauges();
                    selectOption(1);
                }
            } else {
                statusBadge.innerText = "まっすぐ見ている（2.5秒キープ中）";
                statusBadge.className = "status-badge status-straight";

                cardOpt2.classList.remove('active');
                cardOpt1.classList.add('active');

                const progress = Math.min(100, (elapsed / HOLD_TIME) * 100);
                straightGauge.style.width = progress + '%';
                movedGauge.style.width = '0%';

                if (elapsed >= HOLD_TIME) {
                    resetGauges();
                    selectOption(0);
                }
            }
        }

        function resetGauges() {
            currentGazeState = null;
            gazeStateStartTime = null;
            document.getElementById('straight-gauge').style.width = '0%';
            document.getElementById('moved-gauge').style.width = '0%';
        }

        function showQuestion() {
            canAcceptInput = false;
            resetGauges();

            const q = quizData[currentQuestionIndex];
            
            document.getElementById('q-number').innerText = `第 ${currentQuestionIndex + 1} 問 / 全 ${quizData.length} 問`;
            document.getElementById('q-text').innerHTML = q.q_html;
            document.getElementById('opt1-text').innerHTML = q.choices[0].label;
            document.getElementById('opt2-text').innerHTML = q.choices[1].label;

            const imgBox1 = document.getElementById('opt1-img-box');
            const imgBox2 = document.getElementById('opt2-img-box');

            if (q.choices[0].imgSrc) {
                imgBox1.innerHTML = `<img src="${q.choices[0].imgSrc}" class="choice-img">`;
            } else {
                imgBox1.innerHTML = '';
            }

            if (q.choices[1].imgSrc) {
                imgBox2.innerHTML = `<img src="${q.choices[1].imgSrc}" class="choice-img">`;
            } else {
                imgBox2.innerHTML = '';
            }

            document.getElementById('card-opt1').classList.remove('active', 'speaking');
            document.getElementById('card-opt2').classList.remove('active', 'speaking');

            readQuestionAndChoices();
        }

        function readQuestionAndChoices(e) {
            if(e) e.stopPropagation();
            if (!window.speechSynthesis) return;
            
            window.speechSynthesis.cancel();
            canAcceptInput = false;
            resetGauges();

            const statusBadge = document.getElementById('gaze-status');
            statusBadge.innerText = "よみあげ中...";
            statusBadge.className = "status-badge status-waiting";

            const cardOpt1 = document.getElementById('card-opt1');
            const cardOpt2 = document.getElementById('card-opt2');

            cardOpt1.classList.remove('active', 'speaking');
            cardOpt2.classList.remove('active', 'speaking');

            const q = quizData[currentQuestionIndex];

            const uttrQ = new SpeechSynthesisUtterance(q.q_speech);
            uttrQ.lang = 'ja-JP';
            uttrQ.rate = 0.85;

            const uttrOpt1 = new SpeechSynthesisUtterance(q.choices[0].speech);
            uttrOpt1.lang = 'ja-JP';
            uttrOpt1.rate = 0.85;

            const uttrOpt2 = new SpeechSynthesisUtterance(q.choices[1].speech);
            uttrOpt2.lang = 'ja-JP';
            uttrOpt2.rate = 0.85;

            uttrQ.onend = () => {
                cardOpt1.classList.add('speaking');
                window.speechSynthesis.speak(uttrOpt1);
            };

            uttrOpt1.onend = () => {
                cardOpt1.classList.remove('speaking');
                cardOpt2.classList.add('speaking');
                window.speechSynthesis.speak(uttrOpt2);
            };

            uttrOpt2.onend = () => {
                cardOpt2.classList.remove('speaking');
                setTimeout(() => {
                    canAcceptInput = true;
                    resetGauges();
                }, 1200);
            };

            const handleSpeechError = () => {
                cardOpt1.classList.remove('speaking');
                cardOpt2.classList.remove('speaking');
                canAcceptInput = true;
                resetGauges();
            };
            uttrQ.onerror = handleSpeechError;
            uttrOpt1.onerror = handleSpeechError;
            uttrOpt2.onerror = handleSpeechError;

            window.speechSynthesis.speak(uttrQ);
        }

        function selectOption(choiceIndex) {
            canAcceptInput = false;
            resetGauges();
            window.speechSynthesis.cancel();

            const isCorrect = quizData[currentQuestionIndex].choices[choiceIndex].isCorrect;

            currentResults.push({
                qNum: currentQuestionIndex + 1,
                title: quizData[currentQuestionIndex].title,
                isCorrect: isCorrect
            });

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            if (isCorrect) {
                score++;
                feedback.innerHTML = '⭕️';
                feedback.className = 'correct';
                playSound('correct');
            } else {
                feedback.innerHTML = '❌';
                feedback.className = 'incorrect';
                playSound('incorrect');
            }

            setTimeout(() => {
                feedback.style.display = 'none';
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('result-date').innerText = `実施日時：${dateStr}`;
            document.getElementById('score-display').innerText = `${quizData.length}問中 ${score} 問 正解！`;

            const tbody = document.getElementById('current-result-body');
            tbody.innerHTML = '';
            currentResults.forEach(res => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">第 ${res.qNum} 問</td>
                    <td>${res.title}</td>
                    <td class="text-center">${res.isCorrect ? '<span class="status-ok">⭕️ 正解</span>' : '<span class="status-ng">❌ 間違い</span>'}</td>
                `;
                tbody.appendChild(tr);
            });

            saveToStorage(dateStr, score, currentResults);
            renderHistory();

            if (window.speechSynthesis) {
                const uttr = new SpeechSynthesisUtterance(`おつかれさまでした。${quizData.length}もんちゅう、${score}もんせいかいです！`);
                uttr.lang = 'ja-JP';
                window.speechSynthesis.speak(uttr);
            }
        }

        function saveToStorage(date, score, details) {
            let records = JSON.parse(localStorage.getItem('ainu_quiz_history') || '[]');
            records.unshift({ date, score, details });
            localStorage.setItem('ainu_quiz_history', JSON.stringify(records));
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            let records = JSON.parse(localStorage.getItem('ainu_quiz_history') || '[]');

            if (records.length === 0) {
                container.innerHTML = '<p>過去の記録はありません。</p>';
                return;
            }

            let html = '<table class="result-table"><thead><tr><th>日時</th><th>得点</th></tr></thead><tbody>';
            records.forEach(r => {
                html += `<tr><td>${r.date}</td><td class="text-center">${quizData.length}問中 <strong>${r.score}</strong> 問正解</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function clearHistory() {
            if (confirm("これまでの過去の記録をすべてけしますか？")) {
                localStorage.removeItem('ainu_quiz_history');
                renderHistory();
            }
        }

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }
    </script>
</body>
